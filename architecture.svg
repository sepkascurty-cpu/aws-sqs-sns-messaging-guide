<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="940" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#232F3E">AWS SQS &amp; SNS — Decoupled Messaging Architecture</text>
  <text x="30" y="66" font-size="15" fill="#666666">Producers publish once to SNS &#183; SQS queues buffer per consumer &#183; workers process at their own pace &#183; DLQ catches poison messages</text>

  <!-- AWS Cloud boundary -->
  <rect x="20" y="85" width="1160" height="830" fill="none" stroke="#232F3E" stroke-width="2"/>
  <rect x="20" y="85" width="46" height="46" fill="#232F3E"/>
  <text x="43" y="115" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">aws</text>
  <text x="78" y="115" font-size="17" fill="#232F3E">AWS Cloud</text>

  <!-- VPC boundary -->
  <rect x="40" y="300" width="1120" height="560" fill="none" stroke="#1E8A46" stroke-width="2"/>
  <rect x="52" y="312" width="34" height="34" fill="#1E8A46"/>
  <text x="69" y="335" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VPC</text>
  <text x="96" y="335" font-size="15" fill="#1E8A46">VPC — private subnets, no public ingress for workers</text>

  <!-- ===== Producers (top left) ===== -->
  <g>
    <rect x="60" y="150" width="200" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="60" y="150" width="200" height="30" fill="#FF9900"/>
    <text x="160" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Producers</text>
    <text x="160" y="205" font-size="14" fill="#232F3E" text-anchor="middle">EC2 App / API Gateway</text>
    <text x="160" y="228" font-size="13" fill="#666666" text-anchor="middle">Order service, checkout API</text>
    <text x="160" y="248" font-size="12" fill="#666666" text-anchor="middle">publish &#183; fire and forget</text>
  </g>

  <!-- Arrow 1: producers -> SNS -->
  <line x1="260" y1="205" x2="470" y2="205" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="190" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">1. Publish event</text>

  <!-- ===== SNS Topic (top center) ===== -->
  <g>
    <rect x="470" y="150" width="220" height="110" fill="#FDEEF4" stroke="#D13239" stroke-width="2"/>
    <rect x="470" y="150" width="220" height="30" fill="#D13239"/>
    <text x="580" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon SNS Topic</text>
    <text x="580" y="205" font-size="14" fill="#232F3E" text-anchor="middle">orders-events</text>
    <text x="580" y="228" font-size="13" fill="#666666" text-anchor="middle">Pub / Sub megaphone</text>
    <text x="580" y="248" font-size="12" fill="#666666" text-anchor="middle">one publish &#8594; many subscribers</text>
  </g>

  <!-- Arrow: SNS -> SQS standard (AZ1) -->
  <line x1="520" y1="260" x2="330" y2="360" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="300" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">2. Fan-out</text>
  <!-- Arrow: SNS -> SQS FIFO (AZ2) -->
  <line x1="640" y1="260" x2="830" y2="360" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="300" font-size="13" font-weight="bold" fill="#232F3E" text-anchor="middle">2. Fan-out</text>

  <!-- ===== CloudWatch (top right) ===== -->
  <g>
    <rect x="900" y="150" width="220" height="110" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="900" y="150" width="220" height="30" fill="#FF9900"/>
    <text x="1010" y="171" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon CloudWatch</text>
    <text x="1010" y="205" font-size="14" fill="#232F3E" text-anchor="middle">Alarms &amp; metrics</text>
    <text x="1010" y="228" font-size="13" fill="#666666" text-anchor="middle">queue depth &#183; message age</text>
    <text x="1010" y="248" font-size="12" fill="#666666" text-anchor="middle">DLQ depth &gt; 0 &#8594; alert on-call</text>
  </g>

  <!-- ===== Availability Zone 1 ===== -->
  <rect x="60" y="360" width="520" height="380" fill="none" stroke="#7B5EA7" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="320" y="388" font-size="15" fill="#7B5EA7" text-anchor="middle">Availability Zone 1</text>

  <!-- SQS Standard queue -->
  <g>
    <rect x="90" y="405" width="220" height="95" fill="#FDEEF4" stroke="#D13239" stroke-width="2"/>
    <rect x="90" y="405" width="220" height="28" fill="#D13239"/>
    <text x="200" y="424" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon SQS — Standard</text>
    <text x="200" y="452" font-size="14" fill="#232F3E" text-anchor="middle">orders-queue</text>
    <text x="200" y="473" font-size="12" fill="#666666" text-anchor="middle">at-least-once &#183; near-unlimited</text>
    <text x="200" y="491" font-size="12" fill="#666666" text-anchor="middle">retention up to 14 days</text>
  </g>
  <!-- Lambda worker AZ1 -->
  <g>
    <rect x="90" y="530" width="220" height="95" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="90" y="530" width="220" height="28" fill="#FF9900"/>
    <text x="200" y="549" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Lambda</text>
    <text x="200" y="577" font-size="14" fill="#232F3E" text-anchor="middle">order-processor</text>
    <text x="200" y="598" font-size="12" fill="#666666" text-anchor="middle">polls &#183; batch of 10</text>
    <text x="200" y="616" font-size="12" fill="#666666" text-anchor="middle">long polling 20s</text>
  </g>
  <!-- EC2 worker AZ1 -->
  <g>
    <rect x="340" y="530" width="220" height="95" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="340" y="530" width="220" height="28" fill="#FF9900"/>
    <text x="450" y="549" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">EC2 Worker Fleet</text>
    <text x="450" y="577" font-size="14" fill="#232F3E" text-anchor="middle">Auto Scaling group</text>
    <text x="450" y="598" font-size="12" fill="#666666" text-anchor="middle">scales on queue depth</text>
    <text x="450" y="616" font-size="12" fill="#666666" text-anchor="middle">visibility timeout 60s</text>
  </g>
  <!-- Arrow: SQS std -> Lambda -->
  <line x1="200" y1="500" x2="200" y2="530" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="518" font-size="12" fill="#232F3E">3. Poll</text>
  <!-- Arrow: SQS std -> EC2 -->
  <line x1="310" y1="500" x2="400" y2="530" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="512" font-size="12" fill="#232F3E">3. Poll</text>

  <!-- ===== Availability Zone 2 ===== -->
  <rect x="620" y="360" width="520" height="380" fill="none" stroke="#7B5EA7" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="880" y="388" font-size="15" fill="#7B5EA7" text-anchor="middle">Availability Zone 2</text>

  <!-- SQS FIFO queue -->
  <g>
    <rect x="650" y="405" width="220" height="95" fill="#FDEEF4" stroke="#D13239" stroke-width="2"/>
    <rect x="650" y="405" width="220" height="28" fill="#D13239"/>
    <text x="760" y="424" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon SQS — FIFO</text>
    <text x="760" y="452" font-size="14" fill="#232F3E" text-anchor="middle">payments-queue.fifo</text>
    <text x="760" y="473" font-size="12" fill="#666666" text-anchor="middle">strict order &#183; exactly-once</text>
    <text x="760" y="491" font-size="12" fill="#666666" text-anchor="middle">message-group: per customer</text>
  </g>
  <!-- Lambda worker AZ2 -->
  <g>
    <rect x="650" y="530" width="220" height="95" fill="#FDF2E3" stroke="#FF9900" stroke-width="2"/>
    <rect x="650" y="530" width="220" height="28" fill="#FF9900"/>
    <text x="760" y="549" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Lambda</text>
    <text x="760" y="577" font-size="14" fill="#232F3E" text-anchor="middle">payment-processor</text>
    <text x="760" y="598" font-size="12" fill="#666666" text-anchor="middle">dedup window 5 min</text>
    <text x="760" y="616" font-size="12" fill="#666666" text-anchor="middle">ordered per group ID</text>
  </g>
  <!-- DynamoDB (app tier storage) -->
  <g>
    <rect x="900" y="530" width="220" height="95" fill="#EAF2FA" stroke="#2E6DA4" stroke-width="2"/>
    <rect x="900" y="530" width="220" height="28" fill="#2E6DA4"/>
    <text x="1010" y="549" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Amazon DynamoDB</text>
    <text x="1010" y="577" font-size="14" fill="#232F3E" text-anchor="middle">orders table</text>
    <text x="1010" y="598" font-size="12" fill="#666666" text-anchor="middle">idempotency keys</text>
    <text x="1010" y="616" font-size="12" fill="#666666" text-anchor="middle">processed-event store</text>
  </g>
  <!-- Arrow: SQS FIFO -> Lambda -->
  <line x1="760" y1="500" x2="760" y2="530" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="518" font-size="12" fill="#232F3E">3. Poll</text>
  <!-- Arrow: Lambda -> DynamoDB -->
  <line x1="870" y1="577" x2="900" y2="577" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="885" y="565" font-size="12" fill="#232F3E">4. Write</text>

  <!-- ===== DLQ (below AZs) ===== -->
  <g>
    <rect x="60" y="770" width="520" height="70" fill="#FDECEC" stroke="#D13239" stroke-width="2" stroke-dasharray="7,4"/>
    <text x="320" y="797" font-size="14" font-weight="bold" fill="#D13239" text-anchor="middle">Dead-Letter Queue (DLQ) — orders-dlq</text>
    <text x="320" y="820" font-size="12" fill="#666666" text-anchor="middle">messages failing 3 receives &#8594; moved here &#183; redrive back after the bug is fixed</text>
  </g>
  <!-- Arrow: queues -> DLQ -->
  <line x1="200" y1="625" x2="200" y2="770" stroke="#D13239" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="215" y="700" font-size="12" font-weight="bold" fill="#D13239">5. maxReceiveCount exceeded</text>
  <line x1="760" y1="625" x2="760" y2="770" stroke="#D13239" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ===== S3 payload store ===== -->
  <g>
    <rect x="620" y="770" width="520" height="70" fill="#EAF6EC" stroke="#1E8A46" stroke-width="2"/>
    <text x="880" y="797" font-size="14" font-weight="bold" fill="#1E8A46" text-anchor="middle">Amazon S3 — Large-payload store</text>
    <text x="880" y="820" font-size="12" fill="#666666" text-anchor="middle">messages &gt; 256 KB: store body in S3, send only the pointer through SQS</text>
  </g>
  <!-- Arrow: Lambda -> S3 (payload pattern) -->
  <line x1="1010" y1="625" x2="1010" y2="770" stroke="#1E8A46" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1025" y="700" font-size="12" fill="#1E8A46">6. Large payload</text>

  <!-- CloudWatch alarm arrows -->
  <line x1="1010" y1="260" x2="1010" y2="355" stroke="#FF9900" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="1025" y="310" font-size="12" fill="#FF9900">monitors</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="30" y="932" font-size="12" fill="#999999">Flow: Producer &#8594; SNS topic &#8594; SQS queues (Standard + FIFO) &#8594; Lambda / EC2 workers &#8594; DynamoDB &#183; failures &#8594; DLQ &#183; large payloads &#8594; S3</text>
</svg>
